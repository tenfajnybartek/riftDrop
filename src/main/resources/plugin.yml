name: riftDrop
version: '${version}'
main: pl.tenfajnybartek.riftdrop.RiftDropPlugin
api-version: '1.21'
authors: [tenfajnybartek]
description: Konfigurowalne dropy i progresja górnictwa dla Paper
softdepend: [PlaceholderAPI]
provides: [DropPlugin]
commands:
  drop:
    aliases: [ "stone", "kamien" ]
    description: "Pokazuje drop z kamienia"
  adrop:
    aliases: [ "admindrop" ]
    description: "Komenda admina drop"
  level:
    aliases: [ "poziom", "lvl" ]
    description: "Pokazuje aktualny poziom gracza"
permissions:
  dropplugin.cmd.drop:
    default: true
  dropplugin.cmd.level:
    default: true
  dropplugin.cmd.alevel:
    default: op
  dropplugin.cmd.adrop:
    default: op
  riftdrop.cmd.drop:
    default: false
  riftdrop.cmd.level:
    default: false
  riftdrop.cmd.alevel:
    default: false
  riftdrop.cmd.adrop:
    default: false
