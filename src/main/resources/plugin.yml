name: DropPlugin
version: '${version}'
main: pl.tenfajnybartek.dropplugin.base.DropPlugin
api-version: '1.21'
authors: [tenfajnybartek]
description: Plugin na drop ze stone
softdepend: [PlaceholderAPI]
commands:
  drop:
    aliases: [ "stone", "kamien" ]
    description: "Pokazuje drop z kamienia"
  adrop:
    aliases: [ "admindrop" ]
    description: "Komenda admina drop"
  level:
    aliases: [ "poziom", "lvl" ]
    description: "Pokazuje aktualny poziom gracza"
permissions:
  dropplugin.cmd.drop:
    default: true
  dropplugin.cmd.level:
    default: true
  dropplugin.cmd.alevel:
    default: op
  dropplugin.cmd.adrop:
    default: op
